<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pricelist & Form Robux - VILOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body><!-- STATUS BADGE (pojok kanan atas) --><div id="storeStatusBadge" class="store-status-badge">STATUS : OPEN</div><div class="page">  <div id="pricelistRoot"></div>  <div class="form-container" id="orderSection">
    <h2>Form Pembelian Robux VILOG</h2><form id="frm">
  <div class="form-group">
    <label for="usr">Username Roblox *</label>
    <input type="text" id="usr" name="usr" placeholder="Username Roblox" required>
  </div>

  <div class="form-group">
    <label for="pwd">Password Roblox *</label>
    <input type="password" id="pwd" name="pwd" placeholder="Password Roblox" required>
  </div>

  <div class="form-group">
    <label for="v2">V2L *</label>
    <select id="v2" name="v2" required>
      <option value="">-- Pilih Status --</option>
      <option value="OFF">OFF</option>
      <option value="ON">ON</option>
    </select>
  </div>

  <div class="form-group hidden" id="v2m_div">
    <label for="v2m">Metode V2L *</label>
    <select id="v2m" name="v2m">
      <option value="">-- Pilih Metode --</option>
      <option value="BC">Backup Code</option>
      <option value="EM">Kode Email</option>
    </select>
  </div>

  <div class="form-group hidden" id="bc_div">
    <label for="bc">Backup Code *</label>
    <input type="text" id="bc" name="bc" placeholder="Isi Backup Code">
    <div class="notes">Masukkan 1-3 backup code yang belum dipakai.</div>
  </div>

  <div class="form-group hidden" id="em_div">
    <div class="notes">Pastikan storage email tidak penuh, standby & fast respon.</div>
  </div>

  <div class="form-group">
    <label for="voucher">Voucher Code (opsional)</label>
    <input type="text" id="voucher" name="voucher" placeholder="Masukkan voucher di sini" autocomplete="off">
    <div id="voucherPreview" class="notes" style="margin-top:6px; display:none;"></div>
  </div>

  <div class="form-group hidden">
    <label for="kt">Kategori *</label>
    <input type="text" id="kt" name="kt" readonly required>
  </div>

  <div class="form-group">
    <label for="nm">Nominal *</label>
    <input type="text" id="nm" name="nm" readonly required>
  </div>

  <div class="form-group">
    <label for="hg">Harga *</label>
    <input type="text" id="hg" name="hg" readonly required>
  </div>

  <div style="text-align:center; margin:14px 0 6px;">
    <button type="button" id="btnTg">Pesan via Telegram</button>
  </div>
</form>

  </div></div><!-- ADMIN PANEL --><div id="adminPanel" class="admin-panel" style="display:none;">
  <div class="admin-title">
    <span>Admin Panel</span>
    <span id="adminBadge" class="admin-badge">—</span>
  </div>  <div class="admin-auth">
    <button type="button" id="btnAdminLogin" class="admin-login">Login Admin</button>
    <button type="button" id="btnAdminLogout" class="admin-logout" style="display:none;">Logout</button>
    <div id="adminEmail" class="admin-email"></div>
  </div>  <div class="admin-actions">
    <button type="button" id="btnSetOpen" class="admin-open">OPEN</button>
    <button type="button" id="btnSetClose" class="admin-close">CLOSE</button>
  </div>  <!-- CLOSE REASON -->  <div style="margin-top:10px;">
    <div style="font-weight:900;color:#23314a;margin-bottom:6px;">Alasan Close</div><div class="form-group" style="margin-bottom:8px;">
  <select id="closeReasonSelect">
    <option value="">-- Pilih Alasan --</option>
    <option value="maintenance">Maintenance Mode</option>
    <option value="break">Break Mode</option>
    <option value="stock">Tidak Ada Stock</option>
    <option value="custom">Custom</option>
  </select>
</div>

<div class="form-group hidden" id="closeReasonCustomDiv">
  <input type="text" id="closeReasonCustom" placeholder="Tulis alasan custom di sini...">
</div>

  </div></div><div id="validationContainer"></div><script type="module" src="./app.js"></script></body>
</html>
